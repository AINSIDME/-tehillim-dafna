name: Tehillim diario
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tehillim-dafna
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Generate and upload (private by default)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
        run: python agent.py --upload
      - name: Save progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update chapter progress"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-video-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
